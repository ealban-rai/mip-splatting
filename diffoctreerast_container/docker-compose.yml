services:
  diffoctreerast:
    image: diffoctreerast_builder  # Name of the built image
    build: .
    container_name: diffoctreerast-dev
    runtime: nvidia  # Enable GPU support
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - CUDA_HOME=/usr/local/cuda
    volumes:
      - ./export:/export  # Mounted volume to retrieve the built wheel
    working_dir: /export
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]